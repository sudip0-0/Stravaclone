name: trail-local

services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: trail
      POSTGRES_PASSWORD: trail_local_only
      POSTGRES_USER: trail
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trail -d trail']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: trail-local
      MINIO_ROOT_PASSWORD: trail-local-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: [setup]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_APP_PASSWORD: trail-app-local-value
      MINIO_APP_USER: trail-app
      MINIO_ROOT_PASSWORD: trail-local-secret
      MINIO_ROOT_USER: trail-local
    volumes:
      - ./minio-app-policy.json:/config/minio-app-policy.json:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/trail-private &&
        mc admin user add local "$$MINIO_APP_USER" "$$MINIO_APP_PASSWORD" &&
        mc admin policy create local trail-app-policy /config/minio-app-policy.json &&
        mc admin policy attach local trail-app-policy --user "$$MINIO_APP_USER" &&
        mc anonymous set none local/trail-private
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
