packages:
  - apps/*
  - packages/*

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - sharp
  - expo-image-picker
  - expo-file-system
injectWorkspacePackages: true

# Explicitly reviewed build scripts only: esbuild installs its platform binary;
# protobufjs generates its package-local runtime artifacts.
onlyBuiltDependencies:
  - esbuild
  - protobufjs
