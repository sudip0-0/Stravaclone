name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://trail:trail_ci_only@127.0.0.1:5432/trail
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: trail
          POSTGRES_PASSWORD: trail_ci_only
          POSTGRES_USER: trail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trail -d trail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:security
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @trail/mobile test:coverage
      - run: pnpm build
      - run: docker compose -f infra/compose.yaml config --quiet
