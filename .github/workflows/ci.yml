name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://trail:trail_ci_only@127.0.0.1:5432/trail
      TEST_DATABASE_URL: postgres://trail:trail_ci_only@127.0.0.1:5432/trail
      TEST_HEIC: 'true'
      TEST_MAILPIT: 'true'
      TEST_MINIO: 'true'
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: trail
          POSTGRES_PASSWORD: trail_ci_only
          POSTGRES_USER: trail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trail -d trail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate workflow syntax
        run: >-
          docker run --rm --pull=always
          --mount "type=bind,src=$PWD,dst=/repo,readonly" -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start practical integration services
        run: |
          docker compose -f infra/compose.yaml up -d --wait minio mailpit
          docker compose -f infra/compose.yaml run --rm minio-init
      - run: pnpm audit:security
      - run: pnpm security:release-scan
      - run: pnpm security:test
      - run: pnpm security:docs:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @trail/mobile test:coverage
      - run: pnpm --filter @trail/mobile exec expo install --check
      - run: pnpm --filter @trail/mobile exec expo-doctor .
      - run: pnpm --filter @trail/mobile exec expo config --type public
      - run: pnpm build
      - name: Generate SBOM/license evidence and scan API image
        run: pnpm security:supply-chain
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-evidence
          path: artifacts/security
          if-no-files-found: error
      - name: Detect migration drift
        run: |
          pnpm --filter @trail/api db:generate
          git diff --exit-code -- apps/api/src/db/migrations
      - run: pnpm infra:validate
      - name: Build pinned backup validation tooling
        run: docker build --pull=false -f infra/backup-validation.Dockerfile -t trail-backup-validation:ci infra
      - name: Validate authenticated backup and safe restore
        run: >-
          docker run --rm --network host --read-only --user 70:70
          --mount "type=bind,src=$PWD,dst=/workspace,readonly"
          --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777
          --tmpfs /validation:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0700
          -w /workspace
          -e TMPDIR=/validation
          -e BACKUP_VALIDATION_WORK_DIR=/validation/run
          -e ADMIN_DATABASE_URL=postgres://trail:trail_ci_only@127.0.0.1:5432/postgres
          trail-backup-validation:ci
          scripts/ops/validate-backup-restore.sh
      - name: Stop integration services
        if: always()
        run: docker compose -f infra/compose.yaml down --volumes
